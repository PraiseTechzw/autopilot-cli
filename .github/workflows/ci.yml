name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @traisetech/autopilot run lint
      - run: pnpm --filter @traisetech/autopilot run test
      - run: pnpm --filter @workspace/autopilot-docs run build
      - run: pnpm --filter @workspace/api-server run build
