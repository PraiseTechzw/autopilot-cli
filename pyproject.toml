[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-dev"
description = "AI operating layer for software development"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
license = "MIT"
dependencies = ["typer>=0.12"]
keywords = ["developer-tools", "automation", "ai", "git", "github"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ai = []

[project.scripts]
autopilot = "autopilot.cli:app"
autopilot-dot = "autopilot.cli:app"
autopilot-cli = "autopilot.cli:app"
dot = "autopilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "autopilot.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
